version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      # connectrpc pins buffa with a hard requirement, so the
      # two stacks must move together
      buffa:
        patterns:
          - "buffa"
          - "buffa-*"
          - "connectrpc"
          - "connectrpc-*"
      cargo-minor-and-patch:
        # An explicit "*" is required: a group without patterns
        # outranks any wildcard pattern in dependabot's group
        # assignment, which would pull buffa-*/connectrpc-* out of
        # the buffa group above.
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      actions-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
