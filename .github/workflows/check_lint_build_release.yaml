name: Check, Lint, Test, Build, Release

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check-prettier:
    name: Check Prettier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check Prettier formatting
        uses: actionsx/prettier@v3
        with:
          args: --check .

  check-generated-proto:
    name: Check Generated Proto
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install buf
        uses: bufbuild/buf-action@v1
        with:
          setup_only: true

      - name: Lint protos
        run: buf lint proto

      - name: Check proto formatting
        run: |
          if ! buf format --diff --exit-code proto; then
            echo "::error::proto/ is not formatted. Run \`just fmt\` locally and commit the result."
            exit 1
          fi

      - name: Regenerate proto code
        run: buf generate --clean

      # `git diff --exit-code` only inspects tracked files; new files added by
      # the regeneration are untracked and would slip past it. `git add -N`
      # marks new files as intent-to-add so they show up in the diff.
      - name: Assert no diff vs checked-in generated code
        run: |
          git add -N lib/proto/generated
          if ! git diff --exit-code lib/proto/generated; then
            echo "::error::lib/proto/generated/ is out of sync with proto/. Run \`just generate\` locally and commit the result."
            exit 1
          fi

  check-rustfmt:
    name: Check Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # nightly is needed for formatting imports correctly
      - name: Install latest nightly toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: x86_64-unknown-linux-gnu

      - name: Check Rust formatting
        # import formatting is nightly only
        run: cargo +nightly fmt --all -- --check

  check-clippy-nightly:
    name: Check Clippy (nightly)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          components: clippy

      - name: Check Clippy
        # We want to hunt for unqualified local imports, but that requires nightly.
        # Nightly introduces a bunch of new errors - we therefore run clippy in
        # two stages: one regular, and one on nightly with specifically only
        # checking for unqualified local imports.
        # prettier-ignore
        run: cargo +nightly clippy -- -A clippy::all -D unqualified_local_imports -Zcrate-attr="feature(unqualified_local_imports)"

  check-clippy:
    name: Check, Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # Must happen /after/ the checkout step, to pick up the toolchain
      # from the `rust-toolchain.toml` file.
      - name: Install toolchain
        run: |
          rustup install 
          rustup component add clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: x86_64-unknown-linux-gnu

      - name: Cargo check
        run: cargo check --all-targets

      - name: Clippy
        run: |
          cargo clippy --all-targets

  check-unused-deps:
    name: Check unused deps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main

      - name: Install cargo-shear
        # Pinned: cargo-shear >= 1.12.0 pulls in deps requiring rustc 1.91,
        # but our toolchain is 1.88.0
        run: cargo binstall --no-confirm cargo-shear@1.11.2

      - name: Check for unused dependencies
        run: cargo shear --deny-warnings

  # Parses `CI_BITCOIN_CORE_VERSIONS` out of `lib/version.rs`, and the ecash
  # builds (the pinned drynet tag plus the rolling alphanet build) out of
  # `scripts/setup_integration_tests.sh`, and emits the integration-test
  # matrix. Keeping the list of stock versions in
  # source means the Rust-side `SUPPORTED_BITCOIN_CORE_MAJORS` and the CI
  # matrix can't drift — a unit test (`ci_versions_match_majors`) asserts
  # the two are consistent. The drynet tag lives in the setup script so
  # local `just test-it --bitcoind drynetN` runs and CI exercise the same
  # release.
  compute-integration-matrix:
    name: Compute integration-test matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7

      - name: Build matrix from lib/version.rs + setup_integration_tests.sh
        id: build
        run: |
          set -euo pipefail
          VERSIONS=$(grep -oE '"[0-9]+\.[0-9]+"' lib/version.rs | tr -d '"')
          COUNT=$(printf '%s\n' "$VERSIONS" | grep -c . || true)
          if [ "$COUNT" -ne 3 ]; then
            echo "expected 3 versions in lib/version.rs, found $COUNT:" >&2
            printf '%s\n' "$VERSIONS" >&2
            exit 1
          fi
          for v in $VERSIONS; do
            if ! echo "$v" | grep -qE '^[0-9]+\.[0-9]+$'; then
              echo "invalid version in lib/version.rs: '$v'" >&2
              exit 1
            fi
          done
          DRYNET_TAG=$(grep -oE '^DRYNET_DEFAULT_REVISION="[^"]+"' scripts/setup_integration_tests.sh | cut -d'"' -f2)
          if [ -z "$DRYNET_TAG" ]; then
            echo "could not parse DRYNET_DEFAULT_REVISION from scripts/setup_integration_tests.sh" >&2
            exit 1
          fi
          # Every entry carries a display `name` plus either `zip` (a
          # drivechain-patched build fetched from releases.drivechain.info,
          # runs the full suite) or `version` (a stock release fetched from
          # bitcoincore.org, skips drivechain-consensus tests). Steps key
          # off those fields, not off which entry they are. `grpc_checks`
          # marks the one entry that also runs the flavor-independent gRPC
          # reflection checks.
          DRYNET_MAGIC=$(./scripts/setup_integration_tests.sh --print-regtest-magic "$DRYNET_TAG")
          ALPHANET_MAGIC=$(./scripts/setup_integration_tests.sh --print-regtest-magic alphanet)
          ITEMS='{"name":"bitcoin-patched","zip":"L1-bitcoin-patched-latest","grpc_checks":true}'
          ITEMS="$ITEMS,{\"name\":\"ecash-bitcoin $DRYNET_TAG\",\"zip\":\"L1-ecash-bitcoin-$DRYNET_TAG\",\"regtest_magic\":\"$DRYNET_MAGIC\"}"
          ITEMS="$ITEMS,{\"name\":\"ecash-bitcoin alphanet\",\"zip\":\"L1-ecash-bitcoin-alphanet\",\"regtest_magic\":\"$ALPHANET_MAGIC\"}"
          for v in $VERSIONS; do
            ITEMS="$ITEMS,{\"name\":\"Bitcoin Core $v\",\"version\":\"$v\"}"
          done
          MATRIX="{\"include\":[${ITEMS}]}"
          echo "matrix=${MATRIX}" >> "$GITHUB_OUTPUT"
          echo "$MATRIX"

  build-integration-binaries:
    name: Build integration-test binaries
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # Must happen /after/ the checkout step, to pick up the toolchain from
      # rust-toolchain.toml.
      - name: Install Rust toolchain
        run: rustup install

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: x86_64-unknown-linux-gnu

      # Build the two flavor-independent executables once. The matrix jobs
      # only vary the Bitcoin Core binary and can all run these same builds.
      - name: Build integration-test binaries
        run: |
          cargo build --locked \
            --package bip300301_enforcer \
            --bin bip300301_enforcer
          cargo build --locked \
            --package bip300301_enforcer_integration_tests \
            --example integration_tests

      - name: Stage integration-test binaries
        run: |
          mkdir -p "$RUNNER_TEMP/integration-test-binaries"
          cp target/debug/bip300301_enforcer \
            "$RUNNER_TEMP/integration-test-binaries/"
          cp target/debug/examples/integration_tests \
            "$RUNNER_TEMP/integration-test-binaries/"

      - name: Upload integration-test binaries
        uses: actions/upload-artifact@v7
        with:
          name: integration-test-binaries
          path: ${{ runner.temp }}/integration-test-binaries
          retention-days: 1
          if-no-files-found: error

  integration-test:
    name: Integration test (${{ matrix.name }})
    needs: [compute-integration-matrix, build-integration-binaries]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.compute-integration-matrix.outputs.matrix) }}
    env:
      ELECTRS_VERSION: v3.2.0
      GRPCURL_VERSION: "1.9.3"
    steps:
      - name: Download drivechain-patched Bitcoin Core (${{ matrix.name }})
        if: matrix.zip
        run: |
          pushd ..
          DIR='${{ matrix.zip }}-x86_64-unknown-linux-gnu'
          wget "https://releases.drivechain.info/${DIR}.zip"
          unzip "${DIR}.zip"
          rm "${DIR}.zip"
          mv "${DIR}" bitcoin-bins
          chmod +x bitcoin-bins/bitcoind
          chmod +x bitcoin-bins/bitcoin-cli
          chmod +x bitcoin-bins/bitcoin-util
          popd

      - name: Download Bitcoin Core (stock ${{ matrix.version }})
        if: matrix.version
        run: |
          pushd ..
          VERSION='${{ matrix.version }}'
          TARBALL="bitcoin-${VERSION}-x86_64-linux-gnu.tar.gz"
          wget "https://bitcoincore.org/bin/bitcoin-core-${VERSION}/${TARBALL}"
          tar -xf "${TARBALL}"
          rm "${TARBALL}"
          mv "bitcoin-${VERSION}/bin" bitcoin-bins
          rm -r "bitcoin-${VERSION}"
          chmod +x bitcoin-bins/bitcoind
          chmod +x bitcoin-bins/bitcoin-cli
          chmod +x bitcoin-bins/bitcoin-util
          popd

      - name:
          Download stock Bitcoin Core 30.2 (BITCOIND_UNPATCHED for mixed-version
          tests)
        # `test_peer_bmm_request` exercises a cross-binary p2p path via
        # `BITCOIND_UNPATCHED`. For the stock matrix we reuse the same
        # stock binary; for the drivechain-patched jobs we still want a
        # stock 30.2 alongside the patched binaries.
        if: matrix.zip
        run: |
          pushd ..
          wget https://bitcoincore.org/bin/bitcoin-core-30.2/bitcoin-30.2-x86_64-linux-gnu.tar.gz
          tar -xf bitcoin-30.2-x86_64-linux-gnu.tar.gz
          rm bitcoin-30.2-x86_64-linux-gnu.tar.gz
          mv bitcoin-30.2/bin bitcoin-unpatched-bins
          rm -r bitcoin-30.2
          popd

      - name: Checkout bitcoin-patched for signet miner script
        # The enforcer itself auto-downloads the miner script at runtime
        # (see `lib/wallet/mine.rs::get_signet_miner_path`), but the
        # integration test harness drives mining externally and still
        # requires `SIGNET_MINER` to point at the script. Stock Bitcoin
        # Core tarballs don't ship `contrib/signet/miner`, and the
        # patched variant's `--getblocktemplate-command` support is what
        # our signet tests rely on — so we fetch it here for every flavor.
        run: |
          pushd ..
          git clone --depth 1 https://github.com/LayerTwo-Labs/bitcoin-patched.git
          popd

      - name: Cache electrs binary
        id: cache-electrs
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/electrs/target/release/electrs
          key: electrs-binary-${{ env.ELECTRS_VERSION }}

      - name: Install electrs
        if: steps.cache-electrs.outputs.cache-hit != 'true'
        run: |
          git clone --branch ${{ env.ELECTRS_VERSION }} --depth 1 https://github.com/mempool/electrs.git ${{ runner.temp }}/electrs
          cd ${{ runner.temp }}/electrs
          cargo build --locked --release

      - uses: actions/checkout@v7

      - name: Download integration-test binaries
        uses: actions/download-artifact@v8
        with:
          name: integration-test-binaries
          path: ${{ runner.temp }}/integration-test-binaries

      # upload-artifact does not preserve executable permissions.
      - name: Make integration-test binaries executable
        run: chmod +x "$RUNNER_TEMP"/integration-test-binaries/*

      # A signet chain can only be extended by real proof-of-work, and no
      # coinbase is spendable until it is 100 blocks deep — so mining one per
      # run cost more than the rest of the suite combined. The harness pins the
      # signet challenge key, which makes the chain reproducible, so the test
      # run mines one on first use into SIGNET_CHAIN_DIR and reuses it after.
      # Here that means: restore it if we have it, and let the test run mine it
      # if we don't.
      #
      # Keyed on the file holding the values that define the chain, so ordinary
      # harness edits keep the cache and a real change invalidates it. The
      # bitcoind build is in the key too, since this caches a datadir written
      # by that binary: `zip` for the drivechain-patched flavors, `version` for
      # stock (exactly one of the two is set per matrix entry). A restored
      # chain that doesn't match the challenge is detected and re-mined rather
      # than used, but nothing detects a datadir from a different flavor — so
      # the key has to keep those apart.
      - name: Restore pre-mined signet chain
        id: cache-signet-chain
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/signet-chain
          key:
            signet-chain-${{ matrix.zip || matrix.version }}-${{
            hashFiles('integration_tests/signet_chain_params.rs') }}

      # Verify gRPC server reflection with real schema-free clients
      # (grpcurl + buf curl). Reuses this job's bitcoind download and debug
      # build; gated to a single matrix entry since the result does not
      # depend on the Bitcoin Core flavor.
      - name: Install buf
        if: matrix.grpc_checks
        uses: bufbuild/buf-action@v1
        with:
          setup_only: true

      - name: Cache grpcurl
        if: matrix.grpc_checks
        id: cache-grpcurl
        uses: actions/cache@v6
        with:
          path: ~/grpcurl-bin
          key: grpcurl-v${{ env.GRPCURL_VERSION }}

      - name: Install grpcurl
        if: |
          matrix.grpc_checks &&
          steps.cache-grpcurl.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/grpcurl-bin
          wget -q "https://github.com/fullstorydev/grpcurl/releases/download/v${GRPCURL_VERSION}/grpcurl_${GRPCURL_VERSION}_linux_x86_64.tar.gz"
          tar -xzf "grpcurl_${GRPCURL_VERSION}_linux_x86_64.tar.gz" -C ~/grpcurl-bin grpcurl

      - name: Verify gRPC reflection (grpcurl + buf curl)
        if: matrix.grpc_checks
        run: |
          export PATH="$HOME/grpcurl-bin:$PATH"
          export BITCOIND='../bitcoin-bins/bitcoind'
          export BIP300301_ENFORCER="$RUNNER_TEMP/integration-test-binaries/bip300301_enforcer"
          ./scripts/verify_reflection.sh

      - name: Run integration tests
        # Stock Bitcoin Core rejects drivechain deposit transactions with
        # `mempool-script-verify-flag-failed (NOPx reserved for soft-fork
        # upgrades)` — the consensus rules repurposing those opcodes only
        # live in the drivechain-patched builds — so we skip
        # `deposit_withdraw_roundtrip` on stock. The remaining tests
        # exercise RPC, block-parser, p2p, and mempool integration with
        # upstream Bitcoin Core. Drivechain-patched builds (`matrix.zip`
        # entries) run the full suite.
        #
        # BITCOIND_HAS_DRIVECHAIN=0 tells the harness that BITCOIND is a
        # stock build, so it spawns it with -acceptnonstdtxn. Patched
        # builds run with real standardness policy — with the flag,
        # IsStandardTx is disabled and a patched build whose OP_DRIVECHAIN
        # outputs classify as non-standard would pass the deposit test
        # here while rejecting deposits with -26 "scriptpubkey" in
        # production, where chain=main forbids the flag.
        run: |
          export BIP300301_ENFORCER="$RUNNER_TEMP/integration-test-binaries/bip300301_enforcer"
          INTEGRATION_TEST_RUNNER="$RUNNER_TEMP/integration-test-binaries/integration_tests"
          export BITCOIND='../bitcoin-bins/bitcoind'
          export BITCOIN_CLI='../bitcoin-bins/bitcoin-cli'
          export BITCOIN_UTIL='../bitcoin-bins/bitcoin-util'
          export ELECTRS='${{ runner.temp }}/electrs/target/release/electrs'
          export SIGNET_MINER='../bitcoin-patched/contrib/signet/miner'
          export SIGNET_CHAIN_DIR='${{ runner.temp }}/signet-chain'
          # Each test leaks a TempDir holding per-component stdout/stderr (the
          # enforcer runs at --log-level=trace). Point TMPDIR at a known
          # directory so the "Upload integration test logs" step can collect
          # them as artifacts when a test fails.
          export TMPDIR="$RUNNER_TEMP/it-logs"
          mkdir -p "$TMPDIR"
          # A build with custom P2P magic gets is unable to hand-shake with 
          # stock Bitcoin Core on any network, so peer_bmm_request is skipped.
          export BITCOIND_REGTEST_MAGIC='${{ matrix.regtest_magic }}'
          SKIP_ARGS=()
          if [ -n "$BITCOIND_REGTEST_MAGIC" ]; then
            echo "skipped: peer_bmm_request (build rebrands the P2P magic)"
            SKIP_ARGS+=(--skip peer_bmm_request)
          fi
          if [ -n '${{ matrix.version }}' ]; then
            export BITCOIND_UNPATCHED='../bitcoin-bins/bitcoind'
            export BITCOIND_HAS_DRIVECHAIN=0
            "$INTEGRATION_TEST_RUNNER" --skip deposit_withdraw_roundtrip \
              ${SKIP_ARGS[@]+"${SKIP_ARGS[@]}"}
          else
            export BITCOIND_UNPATCHED='../bitcoin-unpatched-bins/bitcoind'
            export BITCOIND_HAS_DRIVECHAIN=1
            "$INTEGRATION_TEST_RUNNER" ${SKIP_ARGS[@]+"${SKIP_ARGS[@]}"}
          fi

      # Did the run end up with a chain worth caching? A run that never needed
      # one (the stock matrix skips the only signet test) leaves nothing to
      # save, and `cache/save` would warn about the missing path.
      #
      # This is a shell test rather than `hashFiles` in the save step's `if`,
      # because `hashFiles` only sees paths inside GITHUB_WORKSPACE — the chain
      # lives in RUNNER_TEMP, so it silently returned '' and the save never ran.
      - name: Check for a mined signet chain
        id: mined-signet-chain
        run: |
          if [ -f "$RUNNER_TEMP/signet-chain/chain-info.txt" ]; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          fi

      # Save whatever chain the run ended up with, so the next run restores it
      # instead of re-mining.
      - name: Save pre-mined signet chain
        if: |
          steps.cache-signet-chain.outputs.cache-hit != 'true' &&
          steps.mined-signet-chain.outputs.present == 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/signet-chain
          key: ${{ steps.cache-signet-chain.outputs.cache-primary-key }}

      - name: Upload integration test logs
        # Only on failure: the leaked TempDirs contain full trace-level
        # enforcer logs plus bitcoind/electrs output, which is what we need to
        # diagnose flakes. Restricted to log files so we don't upload bitcoind
        # block/chainstate data.
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: integration-test-logs-${{ matrix.name }}
          path: |
            ${{ runner.temp }}/it-logs/**/*.txt
            ${{ runner.temp }}/it-logs/**/*.log
          retention-days: 14
          if-no-files-found: warn

  test-build-release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: x86_64-unknown-linux-gnu
            binary-suffix: ""
            rustflags: ""

          - os: macos-latest-large
            name: x86_64-apple-darwin
            binary-suffix: ""
            rustflags: ""

          - os: macos-latest
            name: aarch64-apple-darwin
            binary-suffix: ""
            rustflags: ""

          - os: ubuntu-latest
            name: x86_64-pc-windows-gnu
            binary-suffix: .exe
            rustflags: "-C linker=/usr/bin/x86_64-w64-mingw32-gcc"

    name: Test, Build, Release (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    needs: [check-clippy, check-clippy-nightly]
    permissions:
      contents: write
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # Must happen /after/ the checkout step, to pick up the toolchain
      - run: rustup target add ${{ matrix.name }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}

      - name: Install Rust toolchain
        run: rustup install

      - name: Install windows-specific deps
        run: sudo apt install mingw-w64 nasm
        if: ${{ matrix.name == 'x86_64-pc-windows-gnu' }}

      - name: Test
        run: cargo test --tests

      - name: Build
        run: cargo build --release --target ${{ matrix.name }}
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}

      - name: "Set environment variables: version number and output filenames"
        run: |
          # We still capture the version, but won't use it in the final binary name
          APP_VERSION=$(cargo metadata --format-version 1 | \
            jq -er '.packages | map(select(.name == "bip300301_enforcer") | .version) | .[0]')
          # Use 'latest' in the filename instead of the version
          APP_DIRNAME="bip300301-enforcer-latest-${{ matrix.name }}"
          APP_FILENAME="${APP_DIRNAME}${{ matrix.binary-suffix }}"
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          echo "APP_FILENAME=$APP_FILENAME" >> "$GITHUB_ENV"
          echo "APP_DIRNAME=$APP_DIRNAME" >> "$GITHUB_ENV"

      - run: |
          mkdir release
          cp target/${{ matrix.name }}/release/bip300301_enforcer${{ matrix.binary-suffix }} release/${{ env.APP_FILENAME }}

      - name: "Upload artifacts"
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APP_DIRNAME }}
          if-no-files-found: error
          path: |
            release/${{ env.APP_FILENAME }}

      - name: Release
        uses: softprops/action-gh-release@v3.0.2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            release/${{ env.APP_FILENAME }}
          fail_on_unmatched_files: true

  upload-releases-to-releases-drivechain-info:
    name: Upload releases to releases.drivechain.info
    runs-on: ubuntu-latest
    needs: [test-build-release]
    if: github.ref == 'refs/heads/master'
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8

      - name: Create zip files for releases.drivechain.info
        run: |
          shopt -s extglob
          zip -r bip300301-enforcer-latest-x86_64-apple-darwin.zip bip300301-enforcer-latest-x86_64-apple-darwin
          zip -r bip300301-enforcer-latest-aarch64-apple-darwin.zip bip300301-enforcer-latest-aarch64-apple-darwin
          zip -r bip300301-enforcer-latest-x86_64-pc-windows-gnu.zip bip300301-enforcer-latest-x86_64-pc-windows-gnu
          zip -r bip300301-enforcer-latest-x86_64-unknown-linux-gnu.zip bip300301-enforcer-latest-x86_64-unknown-linux-gnu

      - name: Upload release assets to releases.drivechain.info
        uses: appleboy/scp-action@v1
        with:
          host: 45.33.96.47
          username: root
          password: ${{ secrets.RELEASES_SERVER_PW }}
          port: 22
          source: "bip300301-enforcer-latest-*.zip"
          target: "/var/www/html/"
